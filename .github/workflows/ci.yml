name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.16, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    # The integration suite needs live Postgres and MySQL. It skips itself
    # when they are unreachable, so this job is informational on forks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: difftest
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: difftest
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          DATAPARITY_TEST_PG: postgres://postgres:test@localhost:55432/difftest
          DATAPARITY_TEST_MYSQL_HOST: 127.0.0.1
          DATAPARITY_TEST_MYSQL_PORT: 53306
          DATAPARITY_TEST_MYSQL_USER: root
          DATAPARITY_TEST_MYSQL_PASSWORD: test
          DATAPARITY_TEST_MYSQL_DB: difftest
